<div class="web-menu"><h1>读取存档</h1><button class="menu_close" type="button">返回游戏</button><div class="area_save_list"><ul class="save_list">{{for array_save}}<li class="save_display_area save_list_item" data-num="{{>num}}"><span class="slot-num">存档 {{>num + 1}}</span><span class="save_list_item_thumb">{{if img_data != ""}}<img src="{{>img_data}}" alt="存档画面">{{/if}}</span><span class="save_list_item_area"><span class="save_list_item_date">{{:save_date}}</span><span class="save_list_item_text">{{if title}}{{:title}}{{else}}空存档{{/if}}</span></span></li>{{/for}}</ul></div></div>
