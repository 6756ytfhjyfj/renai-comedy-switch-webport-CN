name: Repair resource filenames and verify source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-game.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-game
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore original UTF-8 filenames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path.cwd()
          files = []
          for directory, children, names in os.walk(root):
              children[:] = [x for x in children if x not in ('.git', '.github')]
              files.extend(Path(directory) / name for name in names)
          repaired = 0
          for source in files:
              name = source.relative_to(root).as_posix()
              corrected = name.encode('cp866').decode('utf-8') if any(ord(c) > 127 for c in name) else name
              if corrected == name:
                  continue
              target = root / corrected
              assert target.is_relative_to(root) and not target.exists(), corrected
              target.parent.mkdir(parents=True, exist_ok=True)
              source.rename(target)
              repaired += 1
          assert repaired == 1679, repaired
          for directory, children, names in os.walk(root, topdown=False):
              path = Path(directory)
              if path == root or '.git' in path.relative_to(root).parts or '.github' in path.relative_to(root).parts:
                  continue
              if not any(path.iterdir()):
                  path.rmdir()
          print(f'Restored {repaired} original resource filenames.')
          PY
          git -c core.autocrlf=false add -A .
      - name: Verify all 2590 website files against tested local source
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          rows = []
          for line in subprocess.check_output(['git', 'ls-files', '-s', '-z']).split(b'\0'):
              if not line:
                  continue
              metadata, name = line.split(b'\t', 1)
              if name.startswith(b'.github/'):
                  continue
              rows.append(name + b'\0' + metadata.split()[1] + b'\n')
          assert len(rows) == 2590, len(rows)
          digest = hashlib.sha256(b''.join(sorted(rows))).hexdigest()
          assert digest == '4335c8b014be3be23b674e4ae14d7e476c53af5532a14b31f563ac6543ce7b52', digest
          print('Every filename and Git blob matches the verified local website.')
          PY
      - name: Commit verified resource filenames
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Restore original UTF-8 resource filenames'
          git push origin HEAD:main
          echo 'All 2590 website files match the tested local source.' >> "$GITHUB_STEP_SUMMARY"
