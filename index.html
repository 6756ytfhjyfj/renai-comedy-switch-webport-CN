<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181b35">
  <meta name="description" content="平行恋爱喜剧汉化网页版。完整剧情与附加内容，支持手机横屏和本机存读档。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>平行恋爱喜剧 · 汉化版</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="web.css">
  <script src="web.js" defer></script>
</head>
<body>
  <main id="viewport" aria-label="游戏画面">
    <div id="stage">
      <iframe id="game" src="game/index.html" title="平行恋爱喜剧" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div id="loading" role="status"><span class="spinner"></span><p>正在打开游戏…</p><small>首次打开需要加载图片和音乐</small><button id="enter" hidden>点击进入游戏</button><button id="retry" hidden>重新加载</button></div>
    </div>
  </main>
  <button id="tools-toggle" class="chrome-button" aria-label="打开游戏工具" aria-expanded="false" aria-controls="tools">☰</button>
  <nav id="tools" aria-label="游戏工具" hidden>
    <strong>平行恋爱喜剧</strong>
    <button data-action="menu">游戏菜单</button>
    <button id="fullscreen">进入全屏</button>
    <button id="mute" aria-pressed="false">关闭声音</button>
    <button id="export">导出存档</button>
    <button id="import">导入存档</button>
    <input id="save-file" type="file" accept=".json,application/json" hidden>
    <small>存档保存在当前浏览器。更换设备前可导出备份。</small>
  </nav>
  <aside id="rotate" aria-label="横屏提示"><span class="phone" aria-hidden="true">▯</span><h1>横过手机，开始故事</h1><p>完整画面适合横屏游玩</p><button id="rotate-fullscreen">进入全屏</button><small>如果没有自动旋转，请关闭系统的方向锁定</small></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
